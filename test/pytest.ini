[pytest]
filterwarnings =
    ignore::DeprecationWarning:_yaml
    ignore:.*_distutils_hack:pytest.PytestAssertRewriteWarning
    ignore::pytest.PytestUnknownMarkWarning
log_level = INFO
log_format = %(asctime)s %(levelname)s [%(process)d| __worker_id__] [%(name)s]: %(message)s (%(filename)s:%(lineno)s)
log_date_format=%Y-%m-%d %H:%M:%S

# Arm the (wall + CPU) timeout watchdog only around the test function call,
# excluding setup and teardown. Teardown does slow shutil.rmtree IO that can
# trip the timeout on slow hosts even though it is not test logic.
timeout_func_only = true

artifacts_dir = build/brazil-unit-tests

markers =
    trace_only: marks tests as trace-only (run with kernel tracer, not on hardware)
    compile_only: marks tests as compile-only (compile kernel without execution)
    compile_and_infer: marks tests to compile and run inference on hardware
    simulation: marks tests to run in CPU simulation mode
    fast: marks test as fast-running using manual test vectors only
    slow: marks test as slow-running
    slow_simulation: marks test as slow for CPU simulation (large tensor shapes)
    coverage_parametrize: test parametrization with configurable coverage strategies (singles/pairs/full) and constraint filtering
    platforms(exclude): Mark test with unsupported platforms to skip when --platform-target matches an excluded platform
    high_rank: marks test as requiring more than a single core, making it eligible to be routed to 48xl hosts
    model: marks test as model-derived configuration (use with tier markers: -m "model and optimal")
    tier0: marks test as TIER0 model config (critical model validation, use: -m "model and tier0")
    optimal: marks test as OPTIMAL model config (performance-optimized, use: -m "model and optimal")
    generality: marks test as GENERALITY model config (broad coverage, use: -m "model and generality")
    broad: marks test as BROAD model config (default tier, use: -m "model and broad")

# Coverage config. Lives here (not pyproject.toml) because pytest.ini is
# packaged into the Hydra Fargate test artifact and pyproject.toml is not, so
# the pipeline's --cov-config can resolve it. coverage reads these INI sections
# the same way it reads setup.cfg.
[coverage:run]
branch = true
omit =
    *torch*

[coverage:html]
show_contexts = true
