[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nki_library"
dynamic = ["version", "entry-points"]
description = "NeuronKernelInterfaceLibrary"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["NKI", "Neuron", "Kernels", "High-Performance", "Hardware", "AWS", "Amazon"]
license = "Apache-2.0"
dependencies = [
    "neuronx-cc>=2.26",
    "nki>=0.5.0",
]


[project.optional-dependencies]
test = [
    "numpy>=1.24",
    "ml-dtypes",
    "pandas[parquet]",
    "torch",
    "scipy",
    "typing_extensions",
    "aws-embedded-metrics",
    "boto3",
    "httpx[http2]~=0.28.1",
    "fabric2",
    "paramiko",
    "websocket-client",
    # Preserve compatibility with concurrent fork-based simulator startup.
    "filelock==3.24.2",
    "plotext",
    "allpairspy",
    "debugpy",
    "pytest==8.4.1",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",
    "pytest-rerunfailures",
    "pytest-html",
    "pytest-metadata",
    "pytest-memray",
    "coverage",
    "griffe>=2,<3",
    "ruff==0.14.13",
    "ty==0.0.69",
    "pre-commit",
]

[tool.setuptools]
zip-safe = true
include-package-data = true

# The default index is intentionally not set here so it can be supplied at
# install time. `explicit` restricts this index to the packages in
# [tool.uv.sources].
[[tool.uv.index]]
name = "neuron"
url = "https://pip.repos.neuron.amazonaws.com/"
explicit = true

[tool.uv.sources]
neuronx-cc = { index = "neuron" }
nki = { index = "neuron" }

[tool.setuptools.dynamic]
version = {attr = "nkilib_src.nkilib.version.__version__"}

[tool.setuptools.package-data]
nkilib_src = ["py.typed"]

[tool.ty.environment]
# Infer the language baseline from project.requires-python.
# ty (unlike the test harness) does not read PYTHONPATH or the runtime sys.path.
# These paths let it resolve first-party helpers imported by tests via runtime
# sys.path.insert (scripts/, build-tools/bin/). The interpreter is supplied via
# --python by the caller, which also passes --extra-search-path for any
# environment-specific location the compiler wheels are installed into.
extra-paths = ["scripts", "build-tools/bin", "scripts/weight_store"]

[tool.ty.rules]
# Only entries that differ from the checker's default severity are listed. Every
# correctness rule already defaults to error, so a regression in one fails the
# build with no entry here -- including rules added by future releases. Advisory
# rules default to warning and do not fail the build unless listed.

# Advisory by default: attribute access on a package where a submodule of the
# same name exists resolves differently depending on import order, so it is
# worth failing on. This is the only rule whose severity is raised.
"possibly-missing-submodule" = "error"

# Ignored: dominated by third-party stub limitations that are not expected to
# be fixed, so the few genuine signals they carry are not worth the noise.
# Re-evaluate only if the upstream stubs change.
"too-many-positional-arguments" = "ignore"  # nearly all from stubs that declare dynamic signatures as taking no arguments
"invalid-return-type" = "ignore"            # all from stubs

# src/nkilib_src is not yet type-checked: the rules below report ~7000 diagnostics
# there, which is a separate effort. Scope them off so the kernel tree is still
# gated on invalid-type-form -- a function or other non-type used where a type is
# required, which is what nl.ndarray-as-a-type-hint was. Drop
# entries from this list as each rule is driven to zero.
[[tool.ty.overrides]]
include = ["src/nkilib_src"]

[tool.ty.overrides.rules]
"unresolved-attribute" = "ignore"
"invalid-argument-type" = "ignore"
"not-subscriptable" = "ignore"
"invalid-assignment" = "ignore"
"invalid-parameter-default" = "ignore"
"unsupported-operator" = "ignore"
"possibly-missing-submodule" = "ignore"
"unresolved-import" = "ignore"
"unknown-argument" = "ignore"
"missing-argument" = "ignore"
"not-iterable" = "ignore"
"no-matching-overload" = "ignore"
"call-non-callable" = "ignore"

[tool.ruff]
indent-width = 4
line-length = 120
extend-exclude = ["*model_config.py", "**/mla/config/*.py", "configuration/", "skills"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
docstring-code-format = false

[tool.ruff.lint]
# Enable linting rules
select = [
    "S101",  # assert detection
    "I",     # isort (import sorting)
    "F401",  # unused imports
    "F821",  # undefined names
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["I", "F401"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["S101"]
"**/test_*.py" = ["S101"]
# neurotile uses `assert` for trace-time validation. These are intentional.
"src/nkilib_src/nkilib/experimental/neurotile/**" = ["S101"]
# sparse_attention_indexer numpy torch references use `assert`. The kernel
# files use kernel_assert instead.
"src/nkilib_src/nkilib/experimental/sparse_attention_indexer/*_torch.py" = ["S101"]
